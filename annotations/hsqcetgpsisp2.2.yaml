schema_version: "0.0.3"
sequence_version: "0.1.0"
title: Sensitivity Enhanced 1H-13C HSQC with Adiabatic Pulses
authors:
  - Bruker
created: "2026-06-25"
last_modified: "2026-06-29"
repository: "github.com/waudbylab/pulseprograms"
status: stable
experiment_type:
  - hsqc
  - 2d
dimensions:
  - f2
  - f1
typical_nuclei:
  - [1H, 13C]
acquisition_order:
  - f1
  - f2
description: >
  Gradient-selected phase-sensitive 1H-13C HSQC experiment
  employing INEPT-based coherence transfer, echo-antiecho
  detection, PEP sensitivity enhancement, and broadband
  adiabatic inversion and refocusing pulses. Magnetization
  is transferred from 1H to 13C, evolved during t1,
  transferred back to 1H, and detected with heteronuclear
  decoupling.
features:
  - echo_antiecho
  - gradient_selection
  - sensitivity_enhanced
  - pulsed_field_gradients
  - phase_sensitive
  - echo_antiecho
  - broadband
  - adiabatic_inversion_pulse
  - adiabatic_refocusing_pulse
reference_pulse:
  - {channel: f1, duration: p1, power: pl1}
  - {channel: f2, duration: p3, power: pl2}
transfer_pathway:
  - H[C]